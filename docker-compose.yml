services:
  fraud-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: novapay/fraud-api:1.0.0
    container_name: novapay-fraud-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  fraud-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: novapay/fraud-frontend:1.0.0
    container_name: novapay-fraud-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      # container-network hostname, NOT localhost -- see frontend/app.py's
      # NOVAPAY_API_URL env var and the "Design decisions" note in README.md
      - NOVAPAY_API_URL=http://fraud-api:8000
    depends_on:
      fraud-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # One-off job: `docker compose run --rm retrain` regenerates artifacts/
  # from the latest data/ before rebuilding the API image. Not started by
  # `docker compose up` (no `depends_on` wiring) since retraining is a
  # deliberate, scheduled action -- see monitoring/RETRAINING_PLAYBOOK.md.
  retrain:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: novapay/fraud-api:1.0.0
    container_name: novapay-fraud-retrain
    entrypoint: ["python", "-m", "novapay_fraud.train"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    profiles: ["tools"]
